name: Set up KernelSU-Next
description: download and set up KSUN into the kernel source
inputs:
 susfs:
  description: 'susfs'
  required: true


runs:
  using: composite
  steps:
    - name: Setup KSUN with no susfs
      if: inputs.susfs == 'false'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev

    - name: Setup pershoot KSUN with susfs
      if: inputs.susfs == 'true'
      shell: bash
      run: |
        cd "$COMMON"
        curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs

    - name: enable in defconfig
      shell: bash
      run: |
         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --module CONFIG_KSU
         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --enable CONFIG_MODULES

         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_KDP
         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_RKP
         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_DEFEX
         "$COMMON/scripts/config" --file "$GKI_DEFCONFIG" --disable CONFIG_KSU_SAMSUNG_NO_PATCH_TEXT
      
    - name: Extract KSU Version Info and inject into Kbuild
      shell: bash
      run: |
        cd "$COMMON/KernelSU-Next"

        # Fetch dev branch for version info (tags, commits, etc.)
        git fetch origin dev 2>/dev/null || true
        
        # Extract and export KSU version info from dev branch
        KSU_GIT_VERSION=$(git rev-list --count refs/remotes/origin/dev 2>/dev/null)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 refs/remotes/origin/dev 2>/dev/null || echo "")
        KSU_COMMIT=$(git rev-parse --short refs/remotes/origin/dev 2>/dev/null)
        KSU_VERSION=$((30000 + KSU_GIT_VERSION))

        cd kernel
        sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/" Kbuild
        sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild
        
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_COMMIT=$KSU_COMMIT" >> $GITHUB_ENV

    - name: Export kernel symbols for KSU module build
      shell: bash
      run: |
        set -euo pipefail
        cd "$COMMON"
        echo "=== Exporting symbols needed by kernelsu.ko (CONFIG_KSU=m) ==="

        export_sym() {
          local file="$1" sym="$2"
          if [ -f "$file" ]; then
            grep -q "EXPORT_SYMBOL.*\b${sym}\b" "$file" 2>/dev/null || {
              echo "EXPORT_SYMBOL_GPL(${sym});" >> "$file"
              echo "  exported ${sym} from ${file}"
            }
          else
            echo "  WARN: ${file} not found, skipping ${sym}"
          fi
        }

        export_sym fs/namespace.c                path_umount
        export_sym mm/maccess.c                  strncpy_from_user_nofault
        export_sym mm/maccess.c                  copy_to_kernel_nofault
        export_sym mm/init-mm.c                  init_mm
        export_sym kernel/kallsyms.c             kallsyms_lookup_size_offset
        export_sym fs/open.c                     __arm64_sys_close
        export_sym arch/arm64/mm/mmu.c           __set_fixmap

        # dcache_clean_inval_poc is defined in cache.S (assembly) — export from a C file
        DCACHE_DONE=false
        for cfile in arch/arm64/mm/flush.c arch/arm64/mm/mmu.c; do
          if [ -f "$cfile" ] && [ "$DCACHE_DONE" = false ]; then
            grep -q 'EXPORT_SYMBOL.*dcache_clean_inval_poc' "$cfile" 2>/dev/null || {
              printf '\nextern void dcache_clean_inval_poc(unsigned long start, unsigned long end);\nEXPORT_SYMBOL_GPL(dcache_clean_inval_poc);\n' >> "$cfile"
              echo "  exported dcache_clean_inval_poc from ${cfile}"
            }
            DCACHE_DONE=true
          fi
        done

        # anon_inode_getfile_secure — only export if the function exists in the source
        if [ -f fs/anon_inodes.c ] && grep -q 'anon_inode_getfile_secure' fs/anon_inodes.c; then
          export_sym fs/anon_inodes.c anon_inode_getfile_secure
        else
          echo "  WARN: anon_inode_getfile_secure not found in source"
        fi

        # __tracepoint_sys_enter — export from the file that creates syscall tracepoints
        if [ -f kernel/trace/syscall.c ] && grep -q 'CREATE_TRACE_POINTS' kernel/trace/syscall.c; then
          grep -q 'EXPORT_TRACEPOINT_SYMBOL.*sys_enter' kernel/trace/syscall.c 2>/dev/null || {
            echo 'EXPORT_TRACEPOINT_SYMBOL_GPL(sys_enter);' >> kernel/trace/syscall.c
            echo "  exported tracepoint sys_enter"
          }
        else
          echo "  WARN: kernel/trace/syscall.c not suitable for tracepoint export"
        fi

        echo "=== Symbol exports complete ==="

    - name: Enable modpost warnings as safety net
      shell: bash
      run: |
        echo "KBUILD_MODPOST_WARN=1" >> $GITHUB_ENV
        # Patch Makefile.modpost so Bazel builds that ignore env vars still get -w
        if [ -f "$COMMON/scripts/Makefile.modpost" ]; then
          sed -i 's/$(if $(KBUILD_MODPOST_WARN),-w)/-w/' "$COMMON/scripts/Makefile.modpost"
          echo "Patched Makefile.modpost to always pass -w to modpost"
        fi

